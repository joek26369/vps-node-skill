name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks 要扫完整历史

      - name: 安装 gitleaks（固定版本 + 校验和）
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tgz="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "/tmp/$tgz" "$base/$tgz"
          curl -fsSL -o /tmp/gitleaks_checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (cd /tmp && grep " $tgz\$" gitleaks_checksums.txt | sha256sum -c -)
          sudo tar -xzf "/tmp/$tgz" -C /usr/local/bin gitleaks
          gitleaks version

      - name: gitleaks（完整历史）
        run: gitleaks git --no-banner --redact -v .

      - name: 语法检查 + 敏感值扫描
        run: bash scripts/repo-lint.sh

      - name: 可执行位检查
        run: |
          bad=0
          while IFS= read -r f; do
            case "$f" in
              *.sh)
                if [ ! -x "$f" ]; then
                  echo "缺少可执行位：$f"
                  bad=1
                fi
                ;;
            esac
          done < <(git ls-files)
          exit $bad
